[project]
name = "faultproxy"
version = "0.1.0"
description = "TCP proxy that injects network faults like latency and connection drops for local resilience testing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
faultproxy = "faultproxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultproxy"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
